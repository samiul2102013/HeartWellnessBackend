$kind: http-request
name: 'Get Profile'
method: GET
url: '{{baseUrl}}/api/users/profile/'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });
      
      const jsonData = pm.response.json();
      
      ["id", "username", "email", "first_name", "last_name", "phone_number", "avatar", "plan", "role", "created_at"].forEach((field) => {
        pm.test(`Response has ${field}`, function () {
          pm.expect(jsonData).to.have.property(field);
        });
      });
      
      if (jsonData && jsonData.id !== undefined && jsonData.id !== null) {
        pm.environment.set("userId", String(jsonData.id));
      }